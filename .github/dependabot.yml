# Dependabot configuration for automatic dependency updates

# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
    # npm dependencies (production + dev)
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'vibe'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Asia/Shanghai'
      open-pull-requests-limit: 5
      # Separate PRs by dependency type for easier review
      groups:
          # Group patch updates together
          patch-updates:
              patterns:
                  - '*'
              update-types:
                  - 'patch'
          # Group minor updates together
          minor-updates:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
      # Prefix commit messages
      commit-message:
          prefix: 'deps'
          prefix-development: 'deps-dev'
          include: 'scope'
      # The `obsidian` package pins @codemirror/state and @codemirror/view to
      # exact peer versions (6.5.0 / 6.38.6). Updating them (or packages that
      # require a newer state, like @codemirror/commands >= 6.11) produces
      # duplicate CodeMirror instances, so hold them until obsidian updates.
      ignore:
          - dependency-name: '@codemirror/state'
          - dependency-name: '@codemirror/view'
          - dependency-name: '@codemirror/commands'
          - dependency-name: '@codemirror/lint'
          - dependency-name: '@eslint/json'
            update-types: ['version-update:semver-major']
      # Reviewers (optional - uncomment and add your team members)
      # reviewers:
      #   - "username"
      # assignees:
      #   - "username"
      # Labels for PRs
      labels:
          - 'dependencies'
          - 'automated'
      # Ignore specific dependencies (if needed)
      # ignore:
      #   - dependency-name: "package-name"
      #     versions: ["x.x.x"]
      # Allow both direct and indirect dependency updates
      allow:
          - dependency-type: 'direct'
          - dependency-type: 'indirect'
      # Rebase strategy
      rebase-strategy: 'auto'

    # GitHub Actions dependencies
    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'vibe'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Asia/Shanghai'
      open-pull-requests-limit: 3
      commit-message:
          prefix: 'ci'
          include: 'scope'
      labels:
          - 'github-actions'
          - 'dependencies'
          - 'automated'
      rebase-strategy: 'auto'
