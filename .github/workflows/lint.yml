name: Lint

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'
            - run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Build project
              run: npm run build
